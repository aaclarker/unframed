[project]
name = "unframed"
version = "0.1.0"
description = "Local 4K Art Mode studio and gallery for Samsung The Frame TVs — zero cloud, zero SmartThings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
    "jinja2>=3.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
