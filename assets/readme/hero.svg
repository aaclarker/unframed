<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Unframed — Local 4K Art Mode Studio for Samsung The Frame</title>
  <desc id="desc">Push 3840x2160 UHD artwork, preview all 16 official Samsung matte colors and 7 matte styles, and manage your TV gallery directly over LAN without SmartThings or cloud access.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232136"/>
      <stop offset="100%" stop-color="#2a273f"/>
    </linearGradient>
    <linearGradient id="canvas-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#393552"/>
      <stop offset="55%" stop-color="#6e6a86"/>
      <stop offset="100%" stop-color="#ea9a97"/>
    </linearGradient>
  </defs>

  <!-- Outer Canvas Background (Rosé Pine Moon) -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#393552" stroke-width="2"/>

  <!-- Subtle architectural measurement grid lines -->
  <line x1="650" y1="24" x2="650" y2="356" stroke="#393552" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="48" y1="306" x2="618" y2="306" stroke="#393552" stroke-width="1"/>

  <!-- LEFT: Title & Value Block -->
  <g id="title-block" transform="translate(52 46)">
    <!-- Rose Eyebrow Pill -->
    <rect x="0" y="0" width="388" height="30" rx="8" fill="#ea9a97"/>
    <text x="14" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#232136" letter-spacing="1.2">SAMSUNG THE FRAME · LAN-ONLY STUDIO</text>

    <!-- Main Title -->
    <text x="0" y="102" font-family="Georgia, 'Times New Roman', Times, serif" font-size="72" font-weight="400" font-style="italic" fill="#e0def4" letter-spacing="-1">Unframed</text>
    <text x="318" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="300" fill="#6e6a86">/</text>
    <text x="342" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="600" fill="#908caa" letter-spacing="0.5">STUDIO</text>

    <!-- Plain-language Value Proposition -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#e0def4">
      Push 4K Art Mode photos and mattes over local Wi-Fi.
    </text>
    <text x="0" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#908caa">
      No Samsung account. No SmartThings app. Built for TVs
    </text>
    <text x="0" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#908caa">
      firewalled from the internet.
    </text>

    <!-- Key Capability Pills -->
    <g transform="translate(0 278)">
      <rect x="0" y="0" width="136" height="32" rx="8" fill="#2a273f" stroke="#44415a" stroke-width="1"/>
      <text x="68" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#ea9a97">3840 × 2160</text>

      <rect x="148" y="0" width="152" height="32" rx="8" fill="#2a273f" stroke="#44415a" stroke-width="1"/>
      <text x="224" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#e0def4">7 × 16 Mattes</text>

      <rect x="312" y="0" width="142" height="32" rx="8" fill="#2a273f" stroke="#44415a" stroke-width="1"/>
      <text x="383" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#9ccfd8">Auto-Detect</text>

      <rect x="466" y="0" width="112" height="32" rx="8" fill="#2a273f" stroke="#44415a" stroke-width="1"/>
      <text x="522" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="500" fill="#c4a7e7">D2D TLS</text>
    </g>
  </g>

  <!-- RIGHT: Physical Frame TV + Beveled Matte Cutout Specimen -->
  <g id="project-proof" transform="translate(684 38)">
    <!-- Outer TV Bezel (16:9 proportioned) -->
    <rect x="0" y="14" width="464" height="252" rx="6" fill="#191724" stroke="#44415a" stroke-width="2"/>
    <rect x="8" y="22" width="448" height="236" rx="4" fill="#1f1d2e"/>

    <!-- Warm Linen Matte Board (flexible_polar) -->
    <rect x="14" y="28" width="436" height="224" fill="#faf4ed"/>
    <!-- Inner Bevel Cutout Shadow -->
    <rect x="48" y="54" width="368" height="172" fill="none" stroke="#dfdad9" stroke-width="3"/>
    <rect x="50" y="56" width="364" height="168" fill="url(#canvas-sky)"/>

    <!-- Stylized Artwork Inside the 16:9 Cutout -->
    <!-- Warm sun disc -->
    <circle cx="296" cy="112" r="28" fill="#f6c177" opacity="0.92"/>
    <!-- Layered hills -->
    <path d="M50 182 Q130 140 220 174 T414 158 L414 224 L50 224 Z" fill="#393552"/>
    <path d="M50 198 Q175 168 285 194 T414 186 L414 224 L50 224 Z" fill="#232136"/>

    <!-- Rule of Thirds Crop Grid & Corner Handles Overlay -->
    <line x1="171" y1="56" x2="171" y2="224" stroke="#ffffff" stroke-width="1" stroke-opacity="0.28" stroke-dasharray="3 3"/>
    <line x1="293" y1="56" x2="293" y2="224" stroke="#ffffff" stroke-width="1" stroke-opacity="0.28" stroke-dasharray="3 3"/>
    <line x1="50" y1="112" x2="414" y2="112" stroke="#ffffff" stroke-width="1" stroke-opacity="0.28" stroke-dasharray="3 3"/>
    <line x1="50" y1="168" x2="414" y2="168" stroke="#ffffff" stroke-width="1" stroke-opacity="0.28" stroke-dasharray="3 3"/>

    <!-- Rose Crop Corner Marks -->
    <path d="M50 72 L50 56 L66 56" fill="none" stroke="#ea9a97" stroke-width="2.5"/>
    <path d="M398 56 L414 56 L414 72" fill="none" stroke="#ea9a97" stroke-width="2.5"/>
    <path d="M50 208 L50 224 L66 224" fill="none" stroke="#ea9a97" stroke-width="2.5"/>
    <path d="M398 224 L414 224 L414 208" fill="none" stroke="#ea9a97" stroke-width="2.5"/>

    <!-- Top Status Callout Badges on Frame -->
    <rect x="20" y="0" width="166" height="26" rx="6" fill="#2a273f" stroke="#44415a" stroke-width="1"/>
    <text x="103" y="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#eb6f92">✕ WAN FIREWALLED</text>

    <rect x="196" y="0" width="248" height="26" rx="6" fill="#2a273f" stroke="#9ccfd8" stroke-width="1"/>
    <text x="320" y="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#9ccfd8">● LAN WSS :8002 CONNECTED</text>

    <!-- Bottom Matte Swatch Strip & Spec Label -->
    <g transform="translate(0 280)">
      <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#908caa">MATTE: flexible_polar</text>
      <g transform="translate(212 2)">
        <rect x="0" y="0" width="24" height="20" rx="4" fill="#faf4ed" stroke="#ea9a97" stroke-width="2"/>
        <rect x="30" y="0" width="24" height="20" rx="4" fill="#ebe6dc" stroke="#44415a" stroke-width="1"/>
        <rect x="60" y="0" width="24" height="20" rx="4" fill="#dfd7c8" stroke="#44415a" stroke-width="1"/>
        <rect x="90" y="0" width="24" height="20" rx="4" fill="#1c1c1c" stroke="#44415a" stroke-width="1"/>
        <rect x="120" y="0" width="24" height="20" rx="4" fill="#c2d1cc" stroke="#44415a" stroke-width="1"/>
        <rect x="150" y="0" width="24" height="20" rx="4" fill="#aebfae" stroke="#44415a" stroke-width="1"/>
        <rect x="180" y="0" width="24" height="20" rx="4" fill="#5c282b" stroke="#44415a" stroke-width="1"/>
        <rect x="210" y="0" width="24" height="20" rx="4" fill="#233247" stroke="#44415a" stroke-width="1"/>
      </g>
    </g>
  </g>
</svg>
